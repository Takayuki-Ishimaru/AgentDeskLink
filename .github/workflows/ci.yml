name: Beta validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    strategy:
      matrix:
        # The native helper currently builds with Visual Studio 2022.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm test
      - run: npm run test:extension
      - run: npm run test:package
      - run: npm audit --audit-level=low
      - run: npm run benchmark
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:extension
      - run: npm run test:package
      # Chromium requires a runner that supports its OS sandbox.
      - run: npm run package:component
  vsix-components:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node -e "require('node:assert/strict').equal(process.platform+'-'+process.arch, '${{ matrix.target }}')"
      - run: npm run package:component
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-component-${{ matrix.target }}
          path: artifacts/*.vsix
          retention-days: 3
  vsix-universal:
    needs: vsix-components
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-component-*
          path: artifacts/components
          merge-multiple: true
      - run: npm run package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: agentdesklink-universal
          path: artifacts/agentdesklink-*.vsix
  vsix-universal-verify:
    needs: vsix-universal
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: agentdesklink-universal
          path: artifacts
      # Every host verifies the identical universal archive with an empty PATH.
      - run: npm run verify:vsix
      - if: runner.os == 'Linux'
        name: Prepare system Chromium sandbox helper
        run: |
          sudo chown root:root /opt/google/chrome/chrome-sandbox
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox
          python3 - <<'PY'
          import os, stat
          helper = '/opt/google/chrome/chrome-sandbox'
          info = os.stat(helper)
          assert info.st_uid == 0 and info.st_mode & stat.S_ISUID, helper
          PY
      - run: npm run verify:vsix -- --download-browser
        env:
          # Chromium documents this system SUID helper for distros restricting user namespaces.
          CHROME_DEVEL_SANDBOX: ${{ runner.os == 'Linux' && '/opt/google/chrome/chrome-sandbox' || '' }}
          DEBUG: pw:browser
  windows-native-build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: cmake -S native/windows-uia-cpp -B native/windows-uia-cpp/build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build native/windows-uia-cpp/build --config Release
      - run: dotnet build native/windows-uia-cpp/tools/fixture/FixtureApp.csproj -c Release
  native-protocol:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native/windows-uia-cpp -B native/windows-uia-cpp/build -DADL_PROTOCOL_TESTS_ONLY=ON
      - run: cmake --build native/windows-uia-cpp/build --config Release
      - run: ctest --test-dir native/windows-uia-cpp/build -C Release --output-on-failure --timeout 30 --no-tests=error
  macos-native-build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: native/macos-ax/build.sh
      # Real GUI AX acceptance needs an explicitly permitted interactive Mac.
